[project]
name = "retail-dq-agent"
version = "0.1.0"
description = "A LangGraph-powered retail data-quality agent with DuckDB profiling and evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.1.3",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.0",
    "pytest>=8.3.0",
    "python-dotenv>=1.0.1",
    "rich>=13.8.0",
    "typer>=0.12.0",
]

[project.scripts]
retail-dq-inject = "src.injection:app"
retail-dq-agent = "src.agent.graph:app"
retail-dq-eval = "eval.eval:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "eval"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
